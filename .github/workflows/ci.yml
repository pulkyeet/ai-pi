name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_pi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: make check
        run: make check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pi_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pi_test
          OPENROUTER_API_KEY: ci-placeholder
          EXA_API_KEY: ci-placeholder
          GITHUB_TOKEN: ci-placeholder
