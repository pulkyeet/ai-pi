name: Nightly (executor concurrency suite)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  chaos-repeat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_pi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: migrate (test DB)
        run: make migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pi_test
          OPENROUTER_API_KEY: ci-placeholder
          EXA_API_KEY: ci-placeholder
          GITHUB_TOKEN: ci-placeholder

      # Concurrency bugs are probabilistic (see
      # docs/execution_phases/phase-02-executor-core.md): a single green run
      # is weak evidence, so the lease/executor/chaos suite runs 50x here.
      # Any flake is a bug to fix, never a test to retry.
      - name: executor concurrency suite x50
        run: >
          uv run pytest tests/integration/test_lease.py
          tests/integration/test_executor.py tests/integration/test_chaos.py
          --count=50 --no-cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pi_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pi_test
          OPENROUTER_API_KEY: ci-placeholder
          EXA_API_KEY: ci-placeholder
          GITHUB_TOKEN: ci-placeholder
