# Nightly ops (Phase 15): keepalive + storage maintenance + backup, on one
# nightly schedule so a failure in any job alerts through GitHub's native
# failed-workflow notification — there is no external alerting service.
#
#   keepalive   — trivial SELECT against Supabase. Free projects pause after 7
#                 days idle; a nightly query never lets them approach the
#                 threshold (stricter than the phase doc's "every 3 days").
#                 A FAILED keepalive IS the alert that the pause guard may be
#                 broken — the workflow's own failure is that notification.
#   maintenance — the nightly eviction (expired unpinned sources.extracted_text),
#                 event pruning behind the retention window, benchmark-source
#                 pinning, and the size query (api.maintenance), against the
#                 production Supabase DB via asyncpg (?ssl=require).
#   backup      — nightly pg_dump -> gzip -> R2 (deploy/backup.sh). Runs from
#                 Actions, not a Fly machine (ephemeral filesystems).
#
# Three independent jobs on purpose: the backup failing must not hide a
# keepalive failure (or vice versa). Keep them separate so the workflow is
# red only when something genuinely is.

name: Keepalive, maintenance & backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client (PGDG repo, matches Supabase's server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Keepalive query (trivial, cheap, keeps the project from idle-pausing)
        run: psql "$SUPABASE_DB_URL" -tAc "SELECT 1"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run storage maintenance (evict / prune / pin / size)
        run: DATABASE_URL="$SUPABASE_DB_URL_ASYNC" uv run python -m api.maintenance
        env:
          SUPABASE_DB_URL_ASYNC: ${{ secrets.SUPABASE_DB_URL_ASYNC }}
          OPENROUTER_API_KEY: ci-placeholder
          EXA_API_KEY: ci-placeholder
          GITHUB_TOKEN: ci-placeholder

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client (PGDG repo, matches Supabase's server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Nightly backup to R2
        run: ./deploy/backup.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # These are account/bucket identifiers, not credentials. Pin them here so a
          # mistyped Actions secret cannot send a valid R2 token to the wrong account.
          R2_ENDPOINT: https://9bc3f8a0bb7fb5e9f23259efabbafc1b.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ai-pi-backups
          AWS_DEFAULT_REGION: auto
