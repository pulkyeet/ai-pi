        hosted on your infrastructure with full control over your data.\\n\\n### Actively
        maintained\\n\\nRegular product updates and continuous releases by a core
        developer team.\\n\\n### Global Community\\n\\nAn active, global community
        participating with development, support and exchange.\\n\\n### Easy download
        and install\\n\\nInstalled and operated on major Linux distributions or via
        Docker container.\\n\\n### Configuration and custom development\\n\\nIndividual
        developments, system integrations, and automations via our API.\\n\\n## FOSS\\n\\n###
        We believe in the values and principles of free and open source software\\n\\nThe
        source code is published on GitHub and is being continuously developed and
        improved by an active open source community; it considers the software freedoms.\\n\\n###
        Open source software\\n\\nOpen source software grants public access to its
        source code. It aims to foster effective collaboration in software development
        among the open source community.\\n\\n&\\n\\n### Software freedom\\n\\nWith
        the free software OpenProject users have the freedom to run, copy, distribute,
        study, modify and improve the software to their needs.\\n\\nFork us on GitHub\\n\\n##
        Contribute\\n\\n### We welcome everybody willing to help make OpenProject
        better\\n\\nThere are a lot of possibilities for contributions, be it adding
        and improving the translations via Crowdin, answering questions in the Community
        forums, adding to the documentation, or by fixing bugs and implementing features.\\n\\nIf
        you want to code, a good starting point would be to make yourself familiar
        with the basic approaches for developing in OpenProject and opening a pull
        request on GitHub referencing an existing bug report or feature request from
        the OpenProject Community. Find our GitHub repository here.\\n\\nIf in doubt
        on how you should start contributing, you can also just contact us.\\n\\n##
        OpenProject API\\n\\n### Create own integrations, retrieve data, and automate
        actions\\n\\nTo integrate own systems or plugins, access data, and automate
        your workflows, build with the easy-to-use OpenProject API.\\n\\nOpenProject\u2019s
        API is a hypermedia REST API, a shorthand for \u201CHypermedia As The Engine
        Of Application State\u201D (HATEOAS). This means that each endpoint of this
        API will have links to other resources or actions defined in the resulting
        body.\\n\\nFor BIM use cases, we also offer a BCF API v2.1, targeted towards
        Building Information Modeling (BIM) use cases. This API builds on top of the
        existing OpenProject data schema.\\n\\n## Roadmap\\n\\n### We continuously
        improve OpenProject\\n\\nPart of our commitment is that we want to give our
        Community a transparent insight into the development process of our features.
        For this reason, the work packages for OpenProject are publicly accessible.
        As soon as a feature is scheduled for development, you will find it on our
        roadmap. Take a look at the OpenProject roadmap to see what we are currently
        working on and what is planned for the near future.\\n\\n## Installation\\n\\n###
        Install and operate the leading web-based open source project management software\\n\\nDownload
        and install OpenProject on-premises within your own infrastructure and keep
        control of your data.\\n\\nOpenProject can be installed and operated with
        DEB/RPM packages on major Linux distributions. We also support installation
        via Docker container and orchestration tools, such as Kubernetes and Helm
        charts.\\n\\nPlease note that you need knowledge in server administration
        to set up and run OpenProject properly and securely.\\n\\nMore about installation
        options\\n\\n## Enterprise edition\\n\\n### Test the Enterprise on-premises
        edition and get even more benefits\\n\\nEasily upgrade your Community to the
        Enterprise on-premises edition and test all additional features 14 days for
