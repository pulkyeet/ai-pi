        \xB7 as of July 2026\\n\\n## Everything you need, nothing you don't\\n\\nPad
        replaces scattered tools with one cohesive system that works for humans and
        AI alike.\\n\\n### Web UI\\n\\nBoard views, list views, rich-content item
        detail with comment threads, keyboard shortcuts, and real-time updates across
