        that require transparency, flexibility, and data sovereignty.\\nManage projects,
        portfolios, products, tasks, bugs, agile workflows, roadmaps, and team collaboration
        in a single platform. OpenProject can be self-hosted and is designed for organizations
        looking for an open source enterprise-ready alternative to tools such as Jira,
        MS Project, Monday, Asana, YouTrack while maintaining full control over their
        data and infrastructure.\\n\\nOpenProject is trusted by organizations worldwide,
        including enterprises, public institutions, and highly regulated industries.\\n\\n![Screenshot
        of OpenProject, showing the GitHub tab on a work package](GitHub-tab-new.png)\\n\\n**OpenProject's
        key features include:**\\n\\n* [Project and portfolio management](https://www.openproject.org/collaboration-software-features/project-portfolio-management/)\\n*
        [Agile boards, Kanban, Scrum, SAFe](https://www.openproject.org/collaboration-software-features/agile-project-management/)\\n*
        [Project planning and scheduling with Gantt charts](https://www.openproject.org/collaboration-software-features/project-planning-scheduling/)\\n*
        [Product and release planning](https://www.openproject.org/collaboration-software-features/product-development/)\\n*
        [Task management and team collaboration](https://www.openproject.org/collaboration-software-features/task-management/)\\n*
        [Time tracking, cost reporting, and budgeting](https://www.openproject.org/collaboration-software-features/time-tracking/)\\n*
        [Bug tracking](https://www.openproject.org/collaboration-software-features/#bug-tracking)\\n*
        [Team collaboration, wikis, forums, news](https://www.openproject.org/collaboration-software-features/team-collaboration/)\\n*
        [Meeting agendas and meeting minutes](https://www.openproject.org/collaboration-software-features/meeting-management/)\\n*
        [Integrations: Nextcloud, XWiki, GitHub, GitLab, and more](https://www.openproject.org/integrations/)\\n\\nMore
        information can be found on our [website](https://www.openproject.org).\\n\\n##
        Start now with OpenProject\\n\\n- **Free Trial**: [Start a 14-days free trial
        of OpenProject](https://start.openproject.com/).\\n- **Community Edition**,
        free of charge: Download OpenProject and get started with the self-hosted
        Community edition. If you want to run an instance of OpenProject in production
        (or for evaluation), refer to our in-depth [installation guides](https://www.openproject.org/download-and-installation/).\\n-
        **Enterprise Edition**: Sign up for the Enterprise version, choose between
        cloud or on-premises and benefit from comprehensive support and Enterprise
        add-ons.\\n- **Documentation**: Explore our [comprehensive documentation](https://www.openproject.org/docs/)
        to help you get up and running quickly.\\n- **Training**: [Book one of our
        training or consulting offers](https://www.openproject.org/training-and-consulting/#training-signup)
        to get your team on board in no time.\\n\\n## Report bugs\\n\\nYou found a
        bug? Please [report it](https://www.openproject.org/docs/development/report-a-bug/)
        to our [OpenProject Community](https://community.openproject.org/projects/openproject).
        Thank you!\\n\\n## Contribute\\n\\nOpenProject is supported by its Community
        members, both companies and individuals.\\n\\nWe are always looking for new
        members to our Community, so if you are interested in improving OpenProject
        we would be glad to welcome and support you getting into the code. There are
        guides as well, e.g. a [Quick Start for Developers](https://www.openproject.org/docs/development/development-environment/),
        but don't hesitate to simply [contact us](https://www.openproject.org/contact)
        if you have questions.\\n\\nWorking on OpenProject comes with the satisfaction
        of working on a widely used open source application.\\n\\nAlso, if you do
        not want to be limited to working on open source in your free time, OpenProject
        GmbH, the company contributing to the OpenProject development, [is hiring](https://www.openproject.org/career/).\\n\\n##
        Stay in contact\\n\\nHere you can find our [contact information](https://www.openproject.org/contact/).
        As we regularly update OpenProject, we recommend staying in touch \u2013 here
        is where you can find us:\\n\\n- [OpenProject Community](https://www.openproject.org/blog/community-instance/)
        with [forum discussions](https://community.openproject.org/projects/openproject/forums):
        The open instance where we develop our features \u2013 transparent and open
        for discussions, bug reports or feature requests.\\n- [LinkedIn](https://www.linkedin.com/company/18706985)\\n-
        [Reddit](https://www.reddit.com/r/openproject/)\\n- [Fosstodon](https://fosstodon.org/@openproject)\\n-
        [Bluesky](https://bsky.app/profile/openproject.bsky.social)\\n\\n## Security
        / responsible disclosure\\n\\nWe take security very seriously at OpenProject.
        We value any kind of feedback that\\nwill keep our Community secure. If you
        happen to come across a security issue we urge\\nyou to disclose it to us
        privately to allow our users and Community enough time to\\nupgrade. Security
        issues will always take precedence over anything else in the pipeline.\\n\\nFor
        more information on how to disclose a security vulnerability, [please see
        this page](docs/security-and-privacy/statement-on-security/README.md).\\n\\n##
        License\\n\\nOpenProject is licensed under the terms of the GNU General Public
        License version 3.\\nSee [COPYRIGHT](COPYRIGHT) and [LICENSE](LICENSE) files
        for details.\\n\\n## Credits\\n\\n### Icons\\n\\nThanks to Vincent Le Moign
