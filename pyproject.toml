[project]
name = "ai-product-investigator"
version = "0.1.0"
description = "AI Product Investigator: evidence-backed product discovery reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "tldextract>=5.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "langfuse>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # Nightly-only: runs the executor's concurrency/chaos suite N times (see
    # docs/execution_phases/phase-02-executor-core.md — concurrency bugs are
    # probabilistic, so a single green run is weak evidence).
    "pytest-repeat>=0.9",
    "hypothesis>=6.112",
    # Needed permanently by tests/integration/test_fixture_corpus.py, which
    # enforces the Phase 01 cassette-corpus exit criteria on every CI run.
    # (httpx itself moved to core deps in Phase 03 — api.retrieval uses it.)
    "vcrpy>=6.0",
]
# Phase 01 spike-only dep. Nothing in src/api may import this — spikes/ is
# throwaway and archived at phase end (see docs/execution_phases/phase-01-*.md).
# (trafilatura moved to core deps in Phase 03 — api.retrieval.extract_text uses it.)
spikes = [
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"spikes".msg = "spikes/ is throwaway Phase 01 code and must never be imported from src/api."
"api.llm.client".msg = "Only api.llm.gateway.structured() may call the OpenRouter client directly — see phase-05-llm-gateway.md's exit criteria."

[tool.ruff.lint.per-file-ignores]
# gateway.py is the one legitimate caller of api.llm.client — see the
# banned-api rule above and phase-05-llm-gateway.md's exit criteria. Its own
# unit tests need the same exemption to test client.py's parsing helpers
# directly.
"src/api/llm/gateway.py" = ["TID251"]
"tests/unit/test_llm_client_parsing.py" = ["TID251"]
"tests/integration/test_llm_client.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/api"]

[[tool.mypy.overrides]]
module = "tldextract.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trafilatura.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external services; excluded from the default run",
]
addopts = """-m 'not live' --cov=src/api/models --cov=src/api/executor --cov=src/api/retrieval \
--cov=src/api/search --cov=src/api/sources --cov=src/api/llm \
--cov-report=term-missing --cov-fail-under=85"""
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "src/api/models", "src/api/executor", "src/api/retrieval",
    "src/api/search", "src/api/sources", "src/api/llm",
]
