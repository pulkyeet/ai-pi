[project]
name = "ai-product-investigator"
version = "0.1.0"
description = "AI Product Investigator: evidence-backed product discovery reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "tldextract>=5.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/api"]

[[tool.mypy.overrides]]
module = "tldextract.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external services; excluded from the default run",
]
addopts = "-m 'not live' --cov=src/api/models --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/api/models"]
